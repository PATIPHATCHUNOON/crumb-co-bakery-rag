<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>สร้างเวกเตอร์ | Crumb & Co.</title><style>body{font:16px/1.6 system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;color:#2d211b}button{font:inherit;border:0;border-radius:8px;background:#a95232;color:#fff;padding:10px 18px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;background:#f5eee6;padding:16px;border-radius:8px}code{background:#f5eee6;padding:2px 5px}</style></head><body><h1>สร้างไฟล์ vectors.json</h1><p>ตั้งค่า <code>WORKER_URL</code> ใน <code>config.js</code> และใส่ Secret ของ Worker ก่อนกดเริ่ม เครื่องมือนี้จะส่งเนื้อหาเอกสารไปยัง OpenRouter ผ่าน Worker เพื่อสร้างเวกเตอร์</p><button id="go">เริ่มสร้างเวกเตอร์</button> <a id="download" hidden>ดาวน์โหลด vectors.json</a><pre id="log">พร้อมเริ่ม</pre><script src="config.js"></script><script>
const C=window.CONFIG,$=id=>document.getElementById(id);$('go').onclick=async()=>{if(!C.WORKER_URL){$('log').textContent='กรุณาตั้งค่า WORKER_URL ก่อน';return}$('go').disabled=true;$('log').textContent='กำลังอ่านเอกสาร...';try{const chunks=[];for(const f of C.FILES){const r=await fetch(`${C.DOCS_BASE}/${f}`);if(!r.ok)throw Error(`อ่าน ${f} ไม่ได้`);const text=(await r.text()).trim();for(let start=0,part=1;start<text.length;start+=C.CHUNK_SIZE-C.OVERLAP,part++)chunks.push({source:f,part,text:text.slice(start,start+C.CHUNK_SIZE)})} $('log').textContent=`อ่าน ${C.FILES.length} ไฟล์ ${chunks.length} ชิ้น กำลังสร้างเวกเตอร์...`;const r=await fetch(C.WORKER_URL.replace(/\/$/,'')+'/api/v1/embeddings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:C.EMBED_MODEL,input:chunks.map(c=>c.text),input_type:'passage'})});if(!r.ok)throw Error(`${r.status} ${(await r.text()).slice(0,180)}`);const d=await r.json();if(d.data?.length!==chunks.length)throw Error('จำนวนเวกเตอร์ไม่ตรงกับเอกสาร');const out={model:C.EMBED_MODEL,chunks:chunks.map((c,i)=>{const v=d.data[i].embedding,n=Math.hypot(...v)||1;return {...c,v:v.map(x=>Math.round((x/n)*10000)/10000)}})};const blob=new Blob([JSON.stringify(out)],{type:'application/json'});$('download').href=URL.createObjectURL(blob);$('download').download='vectors.json';$('download').hidden=false;$('log').textContent=`สำเร็จ ${out.chunks.length} ชิ้น ดาวน์โหลดแล้ววางไฟล์ไว้ข้าง index.html จากนั้นเปลี่ยน SEARCH_MODE เป็น vector` }catch(e){$('log').textContent='ไม่สำเร็จ: '+e.message}finally{$('go').disabled=false}};
</script></body></html>
